<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1478C4">
  <title>Entrar · TemQuadra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/painel.css">
</head>

<body class="pagina-login">
  <svg class="login__quadra" viewBox="0 0 400 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5">
      <rect x="30" y="30" width="340" height="640" rx="8" />
      <line x1="30" y1="350" x2="370" y2="350" />
      <circle cx="200" cy="350" r="62" />
      <path d="M120 30v110h160V30M120 670V560h160v110" />
      <path d="M140 140a60 60 0 0 0 120 0M140 560a60 60 0 0 1 120 0" />
    </g>
  </svg>

  <main class="login">
    <a class="marca marca--clara" href="index.html">
      <span class="marca__selo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <rect x="6" y="2.5" width="12" height="19" rx="1.5" />
          <path d="M6 12h12M9.5 2.5v3h5v-3M9.5 21.5v-3h5v3" />
          <circle cx="12" cy="12" r="2.4" />
        </svg>
      </span>
      TemQuadra
    </a>

    <div class="login__cartao">
      <h1>Área da equipe</h1>
      <p class="login__sub">Entre pra cadastrar quadras e aprovar as sugestões do pessoal.</p>

      <form id="loginForm" class="form" novalidate>
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <input class="entrada" type="email" id="email" required autocomplete="username" placeholder="voce@temquadra.com">
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="passwords">Senha</label>
          <input class="entrada" type="password" id="passwords" required autocomplete="current-password">
        </div>

        <p id="errorMsg" class="login__erro" role="alert" hidden></p>

        <button type="submit" class="btn btn--primario btn--bloco" id="btnLogin">Entrar</button>
      </form>
    </div>

    <a class="login__voltar" href="index.html">Voltar pro mapa</a>
  </main>

  <script type="module" src="js/pages/login-page.js"></script>
</body>

</html>
