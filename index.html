<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadras de Palmas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M12 2C8.1 2 5 5 5 8.9c0 4.7 5.6 10.3 6.3 11a1 1 0 0 0 1.4 0c.7-.7 6.3-6.3 6.3-11C19 5 15.9 2 12 2Z" fill="#fff"/>
          <circle cx="12" cy="9" r="2.4" fill="#0E8A95"/>
        </svg>
      </span>
      <div class="topbar__titulos">
        <h1 class="brand__name">Quadras de Palmas</h1>
        <p class="brand__tag">Onde jogar em Palmas · TO</p>
      </div>
    </div>
    <a class="btn-sugerir" id="btn-sugerir"
       href="https://forms.gle/SEU-FORMULARIO-AQUI"
       target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Sugerir quadra
    </a>
  </header>

  <nav class="filtros" id="filtros" aria-label="Filtros">
    <div class="filtros__grupo">
      <span class="filtros__rotulo">Piso</span>
      <label class="chip"><input type="checkbox" data-grupo="piso" data-valor="areia"><span>Areia</span></label>
      <label class="chip"><input type="checkbox" data-grupo="piso" data-valor="gramado"><span>Gramado</span></label>
      <label class="chip"><input type="checkbox" data-grupo="piso" data-valor="cimento"><span>Cimento</span></label>
      <label class="chip"><input type="checkbox" data-grupo="piso" data-valor="emborrachado"><span>Emborrachado</span></label>
    </div>
    <div class="filtros__grupo">
      <span class="filtros__rotulo">Modalidade</span>
      <label class="chip"><input type="checkbox" data-grupo="modalidade" data-valor="volei"><span>Vôlei</span></label>
      <label class="chip"><input type="checkbox" data-grupo="modalidade" data-valor="basquete"><span>Basquete</span></label>
      <label class="chip"><input type="checkbox" data-grupo="modalidade" data-valor="futsal"><span>Futsal</span></label>
      <label class="chip"><input type="checkbox" data-grupo="modalidade" data-valor="society"><span>Society</span></label>
    </div>
    <div class="filtros__grupo">
      <span class="filtros__rotulo">Equipamentos</span>
      <label class="chip"><input type="checkbox" data-grupo="equipamento" data-valor="redeVolei"><span>Rede de vôlei</span></label>
      <label class="chip"><input type="checkbox" data-grupo="equipamento" data-valor="aroBasquete"><span>Aro de basquete</span></label>
      <label class="chip"><input type="checkbox" data-grupo="equipamento" data-valor="traves"><span>Traves</span></label>
      <label class="chip"><input type="checkbox" data-grupo="equipamento" data-valor="iluminacao"><span>Iluminação</span></label>
    </div>
    <div class="filtros__grupo">
      <span class="filtros__rotulo">Cobertura</span>
      <label class="chip"><input type="checkbox" data-grupo="cobertura" data-valor="coberta"><span>Coberta</span></label>
      <label class="chip"><input type="checkbox" data-grupo="cobertura" data-valor="descoberta"><span>Descoberta</span></label>
    </div>
  </nav>

  <main class="app" id="app">
    <div class="alternador">
      <button class="alternador__btn ativo" data-vista="lista">Lista</button>
      <button class="alternador__btn" data-vista="mapa">Mapa</button>
    </div>

    <section class="app__lista">
      <p id="contador"></p>
      <div id="lista"></div>
    </section>

    <section class="app__mapa">
      <div id="mapa"></div>
    </section>
  </main>

  <aside class="detalhe" id="detalhe" aria-live="polite"></aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
