<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadras de Palmas</title>
  <meta name="description" content="Mapa das quadras esportivas de Palmas (TO): tipo de piso, equipamentos e recursos de iluminação/acessibilidade.">
  
  <!-- Leaflet CSS e Estilos da Aplicação -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <header class="topbar">
    <svg class="topbar__court" viewBox="0 0 300 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="4" y="4" width="292" height="92" rx="6" />
        <line x1="150" y1="4" x2="150" y2="96" />
        <circle cx="150" cy="50" r="17" />
        <path d="M4 30h40v40H4M296 30h-40v40h40" />
      </g>
    </svg>
    <div class="topbar__brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M12 2C8.1 2 5 5 5 8.9c0 4.7 5.6 10.3 6.3 11a1 1 0 0 0 1.4 0c.7-.7 6.3-6.3 6.3-11C19 5 15.9 2 12 2Z" fill="#fff" />
          <circle cx="12" cy="9" r="2.4" fill="#0E8A95" />
        </svg>
      </span>
      <div class="topbar__titulos">
        <h1 class="brand__name">Quadras de Palmas</h1>
        <p class="brand__tag">Onde jogar em Palmas · TO</p>
      </div>
    </div>
    <div class="topbar__acoes">
      <!-- Botão de Entrar / Login adicionado antes de "Doar materiais" -->
      <a href="admin.html" class="btn-topo btn-topo--sec" id="btn-login" aria-label="Entrar no sistema" style="text-decoration: none; display: inline-flex; align-items: center;">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 18px; height: 18px; margin-right: 6px;">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
        <span>Entrar</span>
      </a>
      <button type="button" class="btn-topo btn-topo--sec" id="btn-doar" aria-label="Doar materiais">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z" />
        </svg>
        <span>Doar materiais</span>
      </button>
      <button type="button" class="btn-topo" id="btn-sugerir" aria-label="Sugerir quadra">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>Sugerir quadra</span>
      </button>
    </div>
  </header>

  <!-- Barra de Pesquisa e Filtros -->
  <div class="tela-mapa" id="tela-mapa">
    <div style="padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <input type="text" id="campo-busca" class="entrada" placeholder="🔍 Pesquisar por nome ou bairro..." style="flex: 1; min-width: 250px; min-height: 40px;">
    </div>

    <nav class="filtros" id="filtros" aria-label="Filtros">
      <div class="filtros__grupo">
        <span class="filtros__rotulo">PISO</span>
        <label class="chip"><input type="checkbox" data-grupo="piso" value="cimento"><span>Cimento</span></label>
        <label class="chip"><input type="checkbox" data-grupo="piso" value="emborrachado"><span>Emborrachado</span></label>
        <label class="chip"><input type="checkbox" data-grupo="piso" value="areia"><span>Areia</span></label>
        <label class="chip"><input type="checkbox" data-grupo="piso" value="gramado"><span>Gramado</span></label>
      </div>

      <div class="filtros__grupo">
        <span class="filtros__rotulo">COBERTURA</span>
        <label class="chip"><input type="checkbox" data-grupo="cobertura" value="coberta"><span>Coberta</span></label>
        <label class="chip"><input type="checkbox" data-grupo="cobertura" value="descoberta"><span>Descoberta</span></label>
      </div>

      <div class="filtros__grupo">
        <span class="filtros__rotulo">RECURSOS</span>
        <label class="chip"><input type="checkbox" data-grupo="recurso" value="iluminacao"><span>Iluminação</span></label>
        <label class="chip"><input type="checkbox" data-grupo="recurso" value="acessibilidade"><span>Acessibilidade ♿</span></label>
      </div>
    </nav>

    <main class="app" id="app">
      <div class="alternador">
        <button type="button" class="alternador__btn ativo" data-vista="lista">Lista</button>
        <button type="button" class="alternador__btn" data-vista="mapa">Mapa</button>
      </div>

      <section class="app__lista" aria-label="Lista de quadras">
        <p id="contador" aria-live="polite"></p>
        <div id="lista"></div>
      </section>

      <section class="app__mapa" aria-label="Mapa">
        <div id="mapa"></div>
      </section>
    </main>
  </div>

  <!-- Painéis laterais -->
  <aside class="painel detalhe" id="detalhe" aria-label="Detalhes da quadra"></aside>

  <!-- Biblioteca Externa Leaflet (JS) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Controlador Módulo ES6 da Página Inicial -->
  <script type="module" src="js/pages/map-page.js"></script>
</body>
</html>
