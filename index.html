<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadras de Palmas</title>
  <meta name="description" content="Mapa das quadras esportivas de Palmas (TO): tipo de piso, equipamentos, bebedouro, banheiro e doação de materiais esportivos.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="topbar">
    <svg class="topbar__court" viewBox="0 0 300 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="4" y="4" width="292" height="92" rx="6"/>
        <line x1="150" y1="4" x2="150" y2="96"/>
        <circle cx="150" cy="50" r="17"/>
        <path d="M4 30h40v40H4M296 30h-40v40h40"/>
      </g>
    </svg>
    <div class="topbar__brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
          <path d="M12 2C8.1 2 5 5 5 8.9c0 4.7 5.6 10.3 6.3 11a1 1 0 0 0 1.4 0c.7-.7 6.3-6.3 6.3-11C19 5 15.9 2 12 2Z" fill="#fff"/>
          <circle cx="12" cy="9" r="2.4" fill="#0E8A95"/>
        </svg>
      </span>
      <div class="topbar__titulos">
        <h1 class="brand__name">Quadras de Palmas</h1>
        <p class="brand__tag">Onde jogar em Palmas · TO</p>
      </div>
    </div>
    <div class="topbar__acoes">
      <button type="button" class="btn-topo btn-topo--sec" id="btn-doar" aria-label="Doar materiais">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/></svg>
        <span>Doar materiais</span>
      </button>
      <button type="button" class="btn-topo" id="btn-sugerir" aria-label="Sugerir quadra">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>Sugerir quadra</span>
      </button>
    </div>
  </header>

  <!-- Tela: mapa + lista -->
  <div class="tela-mapa" id="tela-mapa">
    <nav class="filtros" id="filtros" aria-label="Filtros"></nav>

    <main class="app" id="app">
      <div class="alternador">
        <button type="button" class="alternador__btn ativo" data-vista="lista">Lista</button>
        <button type="button" class="alternador__btn" data-vista="mapa">Mapa</button>
      </div>

      <section class="app__lista" aria-label="Lista de quadras">
        <p id="contador" aria-live="polite"></p>
        <div id="lista"></div>
      </section>

      <section class="app__mapa" aria-label="Mapa">
        <div id="mapa"></div>
      </section>
    </main>
  </div>

  <!-- Tela: doar materiais (preenchida por js/doar.js) -->
  <section class="tela-doar" id="tela-doar" hidden aria-label="Doar materiais"></section>

  <!-- Painéis laterais -->
  <aside class="painel detalhe" id="detalhe" aria-label="Detalhes da quadra"></aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/regras.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icones.js"></script>
  <script src="js/navegacao.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
