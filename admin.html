<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F5F8">
  <title>Equipe · TemQuadra</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/painel.css">
</head>

<body class="pagina-admin">
  <header class="admin-topo">
    <div class="admin-topo__marca">
      <a class="marca" href="index.html" aria-label="TemQuadra, ver o mapa">
        <span class="marca__selo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
            <rect x="6" y="2.5" width="12" height="19" rx="1.5" />
            <path d="M6 12h12M9.5 2.5v3h5v-3M9.5 21.5v-3h5v3" />
            <circle cx="12" cy="12" r="2.4" />
          </svg>
        </span>
        TemQuadra
      </a>
      <span class="admin-topo__selo">Equipe</span>
    </div>
    <div class="admin-topo__usuario">
      <span class="admin-topo__nome" id="uName"></span>
      <button type="button" class="btn-icone" id="btnLogout" aria-label="Sair" title="Sair"></button>
    </div>
  </header>

  <main class="admin">
    <div class="admin__saudacao">
      <h1 id="saudacao">Oi!</h1>
      <p id="resumo" aria-live="polite">Carregando…</p>
    </div>

    <div class="abas" role="tablist" aria-label="Seções">
      <button type="button" class="aba" role="tab" id="aba-quadras" aria-controls="sec-quadras" aria-selected="true">
        Quadras <span class="aba__contagem" id="cont-quadras">0</span>
      </button>
      <button type="button" class="aba" role="tab" id="aba-sugestoes" aria-controls="sec-sugestoes" aria-selected="false" tabindex="-1">
        Sugestões <span class="aba__contagem" id="cont-sugestoes">0</span>
      </button>
    </div>

    <section id="sec-quadras" role="tabpanel" aria-labelledby="aba-quadras">
      <div class="admin__barra">
        <input type="search" class="entrada" id="filtro-quadras" placeholder="Filtrar quadras" aria-label="Filtrar quadras">
        <button type="button" class="btn btn--primario" id="btnNovaQuadra"></button>
      </div>
      <ul class="linhas" id="lista-quadras" style="margin-top:14px"></ul>
    </section>

    <section id="sec-sugestoes" role="tabpanel" aria-labelledby="aba-sugestoes" hidden>
      <div class="linhas" id="lista-sugestoes"></div>
    </section>
  </main>

  <!-- Cadastro / edição de quadra -->
  <dialog class="folha" id="modalQuadra" aria-labelledby="modalTitulo">
    <div class="folha__topo">
      <h2 id="modalTitulo">Nova quadra</h2>
      <button type="button" class="btn-icone" id="btnFecharModal" aria-label="Fechar"></button>
    </div>
    <form class="folha__corpo form" id="formQuadra" novalidate>
      <input type="hidden" id="qId">

      <div class="campo">
        <label class="campo__rotulo" for="qNome">Nome da quadra</label>
        <input class="entrada" id="qNome" required>
        <p class="campo__erro" hidden>A quadra precisa de um nome.</p>
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="qEndereco">Endereço</label>
        <input class="entrada" id="qEndereco" required>
        <p class="campo__erro" hidden>Informe o endereço.</p>
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="qBairro">Quadra ou bairro</label>
        <input class="entrada" id="qBairro" placeholder="Ex.: 305 Sul">
      </div>

      <fieldset>
        <legend>Local no mapa</legend>
        <div id="qLocal"></div>
      </fieldset>

      <fieldset>
        <legend>Tipo de piso</legend>
        <div class="escolhas" id="qPisos"></div>
      </fieldset>
      <fieldset>
        <legend>Cobertura</legend>
        <div class="escolhas" id="qCoberturas"></div>
      </fieldset>

      <label class="interruptor">Tem iluminação à noite<input type="checkbox" id="qIluminacao"></label>
      <div id="qExtras" style="display:contents"></div>

      <div class="campo">
        <label class="campo__rotulo" for="qDescricao">Descrição (opcional)</label>
        <textarea class="entrada" id="qDescricao"></textarea>
      </div>

      <fieldset id="divFotos">
        <legend>Fotos (até 5)</legend>
        <div class="fotos" id="qFotos"></div>
      </fieldset>
      <p class="campo__dica" id="avisoFotos" hidden>Por enquanto a API só recebe fotos no cadastro. Pra trocar as fotos, cadastre a quadra de novo.</p>
    </form>
    <div class="folha__rodape">
      <button type="button" class="btn btn--claro" id="btnCancelar">Cancelar</button>
      <button type="submit" form="formQuadra" class="btn btn--primario" id="btnSalvar">Salvar quadra</button>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/pages/admin-page.js"></script>
</body>

</html>
