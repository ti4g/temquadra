<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Painel Admin · TemQuadra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Figtree:wght@400..700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/painel.css">
</head>

<body class="pagina-admin">
  <div class="admin-wrapper">
    <!-- Menu Lateral (Sidebar) -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div>
        <div class="admin-sidebar__topo">
          <a class="admin-sidebar__marca" href="index.html">
            <span class="marca__selo">⚡</span>
            TemQuadra
          </a>
        </div>
        <nav class="admin-sidebar__menu">
          <button type="button" class="admin-nav-item active" id="aba-quadras" data-tab="sec-quadras">
            <span>🏟️ Quadras</span>
            <span class="admin-nav-badge" id="cont-quadras">0</span>
          </button>
          <button type="button" class="admin-nav-item" id="aba-sugestoes" data-tab="sec-sugestoes">
            <span>💡 Sugestões</span>
            <span class="admin-nav-badge admin-nav-badge--alerta" id="cont-sugestoes">0</span>
          </button>
          <button type="button" class="admin-nav-item" id="aba-pontos" data-tab="sec-pontos">
            <span>📍 Pontos de Doação</span>
            <span class="admin-nav-badge" id="cont-pontos">0</span>
          </button>
        </nav>
      </div>

      <div class="admin-sidebar__rodape">
        <div class="user-info">
          <span class="user-avatar">👤</span>
          <span id="uName" class="user-name">Admin</span>
        </div>
        <button type="button" class="btn-icone" id="btnLogout" aria-label="Sair" title="Sair">✕</button>
      </div>
    </aside>

    <!-- Conteúdo Principal -->
    <div class="admin-conteudo">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button type="button" class="btn-toggle-menu" id="btnToggleMenu" aria-label="Abrir menu">☰</button>
          <h1 id="tituloPagina">Quadras do Mapa</h1>
        </div>
      </header>

      <main class="admin-main">
        <!-- SEÇÃO 1: QUADRAS -->
        <section id="sec-quadras">
          <div class="admin__barra">
            <input type="search" class="entrada" id="filtro-quadras"
              placeholder="Filtrar quadras por nome ou bairro...">
            <button type="button" class="btn btn--primario" id="btnNovaQuadra">+ Nova quadra</button>
          </div>
          <ul class="linhas" id="lista-quadras"></ul>
        </section>

        <!-- SEÇÃO 2: SUGESTÕES -->
        <section id="sec-sugestoes" hidden>
          <div class="admin__barra">
            <input type="search" class="entrada" id="filtro-sugestoes" placeholder="Filtrar sugestões...">
          </div>
          <ul class="linhas" id="lista-sugestoes"></ul>
        </section>

        <!-- SEÇÃO 3: PONTOS DE DOAÇÃO -->
        <section id="sec-pontos" hidden>
          <div class="admin__barra">
            <input type="search" class="entrada" id="filtro-pontos" placeholder="Filtrar pontos de doação...">
            <button type="button" class="btn btn--primario" id="btnNovoPonto">+ Novo ponto</button>
          </div>
          <ul class="linhas" id="lista-pontos"></ul>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal Cadastro / Edição de Quadra -->
  <dialog class="folha" id="modalQuadra" aria-labelledby="modalTitulo">
    <div class="folha__topo">
      <h2 id="modalTitulo">Nova quadra</h2>
      <button type="button" class="btn-icone btn-fechar-dialog" data-modal="modalQuadra" aria-label="Fechar">✕</button>
    </div>
    <form class="folha__corpo form" id="formQuadra" novalidate>
      <input type="hidden" id="qId">

      <div class="campo">
        <label class="campo__rotulo" for="qNome">Nome da quadra</label>
        <input class="entrada" id="qNome" required placeholder="Ex.: Quadra Poliesportiva 305 Sul">
      </div>

      <div class="linha-2">
        <div class="campo">
          <label class="campo__rotulo" for="qCep">CEP</label>
          <input class="entrada" id="qCep" maxlength="9" placeholder="77000-000">
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="qBairro">Quadra ou Bairro</label>
          <input class="entrada" id="qBairro" placeholder="Ex.: 305 Sul">
        </div>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="qEndereco">Endereço Completo</label>
        <input class="entrada" id="qEndereco" required placeholder="Ex.: Alameda 9, Quadra 305 Sul">
      </div>

      <div class="linha-2">
        <div class="campo">
          <label class="campo__rotulo" for="qLatitude">Latitude</label>
          <input class="entrada" type="number" step="any" id="qLatitude" placeholder="Ex.: -10.1834">
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="qLongitude">Longitude</label>
          <input class="entrada" type="number" step="any" id="qLongitude" placeholder="Ex.: -48.3336">
        </div>
      </div>

      <div class="linha-2">
        <div class="campo">
          <label class="campo__rotulo" for="qPiso">Tipo de Piso</label>
          <select class="entrada" id="qPiso">
            <option value="CIMENTO">Cimento</option>
            <option value="EMBORRACHADO">Emborrachado</option>
            <option value="AREIA">Areia</option>
            <option value="GRAMADO">Gramado</option>
            <option value="GRAMA_SINTETICA">Grama Sintética</option>
            <option value="OUTRO">Outro</option>
          </select>
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="qCobertura">Cobertura</label>
          <select class="entrada" id="qCobertura">
            <option value="DESCOBERTA">Descoberta</option>
            <option value="COBERTA">Coberta</option>
            <option value="PARCIALMENTE_COBERTA">Parcialmente Coberta</option>
          </select>
        </div>
      </div>

      <div class="grupo-interruptores">
        <label class="interruptor">
          <span>💡 Iluminação Noturna</span>
          <input type="checkbox" id="qIluminacao">
        </label>
        <label class="interruptor">
          <span>♿ Acessibilidade (Rampa)</span>
          <input type="checkbox" id="qAcessibilidade">
        </label>
        <label class="interruptor">
          <span>🚻 Banheiro Público</span>
          <input type="checkbox" id="qBanheiro">
        </label>
        <label class="interruptor">
          <span>🚰 Bebedouro</span>
          <input type="checkbox" id="qBebedouro">
        </label>
      </div>

      <div class="campo">
        <label class="campo__rotulo" for="qDescricao">Descrição (opcional)</label>
        <textarea class="entrada" id="qDescricao" rows="3" placeholder="Insira detalhes adicionais..."></textarea>
      </div>

      <div class="campo" id="divFotos">
        <label class="campo__rotulo" for="qFotos">Fotos da Quadra (MinIO)</label>
        <input class="entrada" type="file" id="qFotos" multiple accept="image/*">
      </div>
    </form>
    <div class="folha__rodape">
      <button type="button" class="btn btn--claro btn-fechar-dialog" data-modal="modalQuadra">Cancelar</button>
      <button type="submit" form="formQuadra" class="btn btn--primario" id="btnSalvar">Salvar quadra</button>
    </div>
  </dialog>

  <!-- Modal Visualização Detalhada Unificada -->
  <dialog class="folha" id="modalDetalheAdmin" aria-labelledby="modalDetalheTitulo">
    <div class="folha__topo">
      <h2 id="modalDetalheTitulo">Detalhes do Registro</h2>
      <button type="button" class="btn-icone btn-fechar-dialog" data-modal="modalDetalheAdmin"
        aria-label="Fechar">✕</button>
    </div>

    <!-- ÁREA DA FOTO (Melhoria visual: aparecerá a foto de forma de destaque) -->
    <div class="visualizacao-midia" id="modalDetalheMidia">
     <img id="modalDetalheFoto" src="" alt="Foto do registro">
    </div>

    <div class="folha__corpo" id="conteudoDetalheAdmin"></div>
    <div class="folha__rodape">
      <button type="button" class="btn btn--claro btn-fechar-dialog" data-modal="modalDetalheAdmin">Fechar</button>
    </div>
  </dialog>

  <!-- Modal Analisar Sugestão -->
  <dialog class="folha" id="modalSugestao">
    <div class="folha__topo">
      <h2>Analisar Sugestão</h2>
      <button type="button" class="btn-icone btn-fechar-dialog" data-modal="modalSugestao"
        aria-label="Fechar">✕</button>
    </div>

    <!-- Melhoria visual de foto para sugestões de quadras -->
    <div class="visualizacao-midia" id="modalSugestaoMidia">
      <img id="modalSugestaoFoto" src="" alt="Foto da sugestão">
    </div>

    <div class="folha__corpo" id="detalheSugestaoConteudo"></div>
    <div class="folha__rodape">
      <button type="button" class="btn btn--claro btn-fechar-dialog" data-modal="modalSugestao">Cancelar</button>
      <button type="button" class="btn btn--primario" id="btnConfirmarAprovacao">Aprovar e Publicar no Mapa</button>
    </div>
  </dialog>


  <!-- Modal Ponto de Doação -->
  <dialog class="folha" id="modalPonto">
    <div class="folha__topo">
      <h2 id="modalPontoTitulo">Novo ponto de doação</h2>
      <button type="button" class="btn-icone btn-fechar-dialog" data-modal="modalPonto" aria-label="Fechar">✕</button>
    </div>
    <form class="folha__corpo form" id="formPonto" novalidate>
      <input type="hidden" id="pId">
      <div class="campo">
        <label class="campo__rotulo" for="pNome">Nome do local</label>
        <input class="entrada" id="pNome" required placeholder="Ex.: Lanchonete do Zé">
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="pEndereco">Endereço</label>
        <input class="entrada" id="pEndereco" required placeholder="Ex.: Quadra 305 Sul">
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="pResponsavel">Responsável</label>
        <!-- Mudança: Dropdown dinâmico -->
        <select class="entrada" id="pResponsavel" required>
          <option value="">Selecione um responsável...</option>
        </select>
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="pTelefone">Telefone / WhatsApp</label>
        <input class="entrada" id="pTelefone" placeholder="(63) 99999-8888">
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="pHorario">Horário de Funcionamento</label>
        <input class="entrada" id="pHorario" placeholder="Seg a Sáb das 08h às 18h">
      </div>
      <!-- Mudança: campo de upload de imagens para ponto_coleta -->
      <div class="campo">
        <label class="campo__rotulo">Fotos do Ponto de Doação (Upload)</label>
        <input class="entrada" type="file" id="pFotos" multiple accept="image/*">
      </div>
    </form>
    <div class="folha__rodape">
      <button type="button" class="btn btn--claro btn-fechar-dialog" data-modal="modalPonto">Cancelar</button>
      <button type="submit" form="formPonto" class="btn btn--primario" id="btnSalvarPonto">Salvar ponto</button>
    </div>
  </dialog>

  <script type="module" src="js/pages/admin-page.js"></script>
</body>

</html>
